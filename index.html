<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>El Rey - Laberinto de la Fortuna</title>
  <meta name="description" content="Laberinto de la fortuna temático 'El Rey'. Arrastra el trébol hacia el regalo y llévate tu extra por WhatsApp." />
  <meta property="og:title" content="El Rey - Laberinto de la Fortuna" />
  <meta property="og:description" content="Arrastra el trébol hacia el regalo y llévate tu extra por WhatsApp." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- CDN oficial de Phaser 3 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #030712;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Marco vertical con proporción 3:4 que encaja exactamente con la medida de 'fondo.png' */
    #app-wrapper {
      position: relative;
      width: 100%;
      max-width: 410px;
      height: auto;
      aspect-ratio: 3 / 4;
      max-height: 96vh;
      display: flex;
      flex-direction: column;
      /* Carga el archivo fondo.png que subirás a GitHub con respaldo de azul zafiro */
      background-color: #08122d;
      background-image: url('fondo.png');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      box-shadow: 0 0 50px rgba(234, 179, 8, 0.28), 0 25px 60px -15px rgba(0, 0, 0, 0.95);
      border: 2px solid rgba(250, 204, 21, 0.45);
      border-radius: 22px;
      overflow: hidden;
    }

    /* Botones flotantes compactos en la esquina superior derecha */
    #floating-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 30;
    }

    .glass-btn {
      background: rgba(10, 25, 69, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(250, 204, 21, 0.55);
      color: #fef08a;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6), 0 0 8px rgba(234, 179, 8, 0.25);
    }

    .glass-btn:hover {
      background: rgba(30, 58, 138, 0.9);
      border-color: #fde047;
      transform: scale(1.08);
      box-shadow: 0 0 14px rgba(250, 204, 21, 0.6);
    }

    .glass-btn:active {
      transform: scale(0.92);
    }

    /* Contenedor transparente del juego Phaser */
    #game-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      touch-action: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    #game-container canvas {
      display: block;
      touch-action: none;
      background: transparent !important;
    }

    /* Pop-up flotante de Victoria ("¡Felicitaciones!") */
    #victory-modal {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.86);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 50;
      animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #victory-modal.active {
      display: flex;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9) translateY(16px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .victory-card {
      background: linear-gradient(180deg, #0f1c3f 0%, #060c20 100%);
      border: 2px solid #facc15;
      border-radius: 26px;
      padding: 28px 22px 22px 22px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      box-shadow: 0 0 35px rgba(250, 204, 21, 0.45), 0 0 15px rgba(234, 179, 8, 0.3), 0 25px 45px rgba(0, 0, 0, 0.95);
      position: relative;
    }

    /* Marco circular dorado prominente y vacío (placeholder) */
    .golden-frame-placeholder {
      width: 82px;
      height: 82px;
      margin: 0 auto 16px auto;
      border-radius: 50%;
      background: rgba(8, 17, 43, 0.55);
      border: 3px solid #facc15;
      box-shadow: 0 0 22px rgba(250, 204, 21, 0.45), inset 0 0 14px rgba(234, 179, 8, 0.25);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .golden-frame-placeholder::after {
      content: '';
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      border: 1px solid rgba(254, 240, 138, 0.65);
      pointer-events: none;
    }

    .victory-title {
      color: #ffffff;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
    }

    .victory-subtitle {
      color: #ffffff;
      font-size: 13.5px;
      line-height: 1.45;
      margin-bottom: 22px;
      opacity: 0.92;
    }

    /* BOTÓN HORIZONTAL VERDE VIBRANTE "COBRAR PREMIO" CON ÍCONO DE WHATSAPP */
    .btn-claim {
      width: 100%;
      background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
      color: #ffffff;
      border: none;
      padding: 15px 18px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 0 28px rgba(34, 197, 94, 0.5), 0 4px 14px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
      margin-bottom: 12px;
      text-decoration: none;
      letter-spacing: 0.3px;
    }

    .btn-claim:hover {
      background: linear-gradient(135deg, #25d366 0%, #15803d 100%);
      transform: translateY(-2px);
      box-shadow: 0 0 36px rgba(37, 211, 102, 0.7);
    }

    .btn-claim:active {
      transform: translateY(1px);
    }

    .btn-claim svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* BOTÓN OSCURO CON BORDE FINO Y TEXTO AMARILLO "JUGAR OTRA PARTIDA" */
    .btn-retry {
      width: 100%;
      background: #09132d;
      color: #facc15;
      border: 1px solid rgba(250, 204, 21, 0.5);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-retry:hover {
      background: rgba(250, 204, 21, 0.12);
      border-color: #fde047;
      color: #fef08a;
      transform: translateY(-1px);
    }

    /* Toast de notificación rápida */
    #toast {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(10, 25, 69, 0.92);
      border: 1px solid #eab308;
      color: #fef08a;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 11.5px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 100;
      box-shadow: 0 0 16px rgba(234, 179, 8, 0.35);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div id="app-wrapper">
    <!-- Controles flotantes en la esquina superior -->
    <div id="floating-controls">
      <button class="glass-btn" id="btn-sound" title="Alternar Sonido">🔊</button>
      <button class="glass-btn" id="btn-restart" title="Nuevo Laberinto">🔄</button>

    <!-- Contenedor del Juego Phaser Transparente -->
    <main id="game-container"></main>

    <!-- Pop-up de Victoria ("¡Felicitaciones!") -->
    <div id="victory-modal">
      <div class="victory-card">
        <!-- Marco circular dorado prominente y vacío (placeholder) -->
        <div class="golden-frame-placeholder"></div>

        <h2 class="victory-title">¡Felicitaciones!</h2>
        <p class="victory-subtitle">¡Llegaste al regalo! Reclama tu premio y llévate tu extra ahora mismo.</p>
        
        <!-- Botón horizontal verde vibrante con ícono de WhatsApp y texto "Cobrar Premio" -->
        <a id="btn-claim-prize" class="btn-claim" href="#" target="_blank" rel="noopener noreferrer">
          <!-- Ícono oficial de WhatsApp SVG -->
          <svg viewBox="0 0 24 24">
            <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766 0-3.187-2.59-5.771-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.007c.106.005.249-.04.39.297.144.35.491 1.2.534 1.288.043.088.072.19.014.305-.058.115-.087.187-.173.289l-.26.309c-.087.087-.179.18-.077.355.101.175.45 0.742.964 1.201.662.591 1.221.774 1.394.861.174.086.275.072.376-.044.102-.115.434-.506.549-.68.116-.174.232-.145.39-.087s1.011.477 1.184.564c.173.087.289.13.332.202.043.073.043.419-.101.824zm-3.423-10.416c-5.523 0-10 4.477-10 10 0 1.884.524 3.646 1.436 5.163l-1.524 5.571 5.733-1.504c1.464.838 3.161 1.317 4.969 1.317 5.523 0 10-4.477 10-10s-4.477-10-10-10zm0 18.393c-1.637 0-3.155-.472-4.436-1.288l-.318-.202-3.3 0.866.881-3.219-.221-.352c-.896-1.425-1.373-3.093-1.373-4.814 0-4.631 3.769-8.4 8.4-8.4s8.4 3.769 8.4 8.4-3.769 8.4-8.4 8.4z"/>

        <!-- Botón oscuro con borde fino y texto amarillo "Jugar otra partida" -->
        <button id="btn-modal-retry" class="btn-retry">

    <!-- Toast -->
    <div id="toast">¡Laberinto generado!</div>

  <script>
    /* ==========================================================================
       CONFIGURACIÓN DE WHATSAPP (MODIFICA AQUÍ TU NÚMERO Y MENSAJE FÁCILMENTE)
       ========================================================================== */
    // 👉 Ingresa tu número de WhatsApp con código de país (sin símbolos '+' ni espacios)
    // Ejemplo Argentina: '5491123456789' | México: '5215512345678' | España: '34600000000'
    const WHATSAPP_PHONE = '5491100000000';

    // 👉 Mensaje personalizado predeterminado para el chat
    const WHATSAPP_MESSAGE = '¡Hola! Acabo de ganar el laberinto de la fortuna El Rey 🍀🎁 ¡Quiero cobrar mi premio!';

    /**
     * Genera la URL dinámica hacia WhatsApp Web / App
     */
    function buildWhatsAppUrl() {
      const encodedMsg = encodeURIComponent(WHATSAPP_MESSAGE);
      return `https://wa.me/${WHATSAPP_PHONE}?text=${encodedMsg}`;
    }

    /* ==========================================================================
       GENERADOR MATEMÁTICO DFS (RECURSIVE BACKTRACKING)
       Garantiza 100% que el laberinto SIEMPRE tenga solución, sin callejones
       bloqueantes ni islas inaccesibles.
       ========================================================================== */
    function generateDFSMaze(cols, rows) {
      const width = cols % 2 === 0 ? cols + 1 : cols;
      const height = rows % 2 === 0 ? rows + 1 : rows;

      // 1 = Pared sólida, 0 = Camino transitable
      const maze = Array.from({ length: height }, () => Array(width).fill(1));

      const stack = [];
      const startX = 1;
      const startY = 1;

      maze[startY][startX] = 0;
      stack.push({ x: startX, y: startY });

      const directions = [
        { dx: 0, dy: -2 }, // Arriba
        { dx: 0, dy: 2 },  // Abajo
        { dx: -2, dy: 0 }, // Izquierda
        { dx: 2, dy: 0 }   // Derecha
      ];

      while (stack.length > 0) {
        const current = stack[stack.length - 1];

        const neighbors = [];
        for (const dir of directions) {
          const nx = current.x + dir.dx;
          const ny = current.y + dir.dy;
          if (nx > 0 && nx < width - 1 && ny > 0 && ny < height - 1 && maze[ny][nx] === 1) {
            neighbors.push({
              x: nx,
              y: ny,
              wallX: current.x + dir.dx / 2,
              wallY: current.y + dir.dy / 2
            });
          }
        }

        if (neighbors.length > 0) {
          const chosen = neighbors[Math.floor(Math.random() * neighbors.length)];
          maze[chosen.wallY][chosen.wallX] = 0;
          maze[chosen.y][chosen.x] = 0;
          stack.push({ x: chosen.x, y: chosen.y });
        } else {
          stack.pop();
        }
      }

      const goalX = width - 2;
      const goalY = height - 2;
      maze[goalY][goalX] = 0;

      return {
        maze,
        width,
        height,
        start: { col: startX, row: startY },
        goal: { col: goalX, row: goalY }
      };
    }

    /* ==========================================================================
       SISTEMA DE AUDIO SINTETIZADO (Web Audio API nativo)
       ========================================================================== */
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playGrab() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(783.99, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playVictory() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.09);
          gain.gain.setValueAtTime(0.14, this.ctx.currentTime + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.09 + 0.45);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.09);
          osc.stop(this.ctx.currentTime + idx * 0.09 + 0.45);
        });
      }
    }

    const sound = new SoundFX();

    /* ==========================================================================
       ESCENA PRINCIPAL DE PHASER 3 ADAPTADA AL FLYER 'fondo.png'
       ========================================================================== */
    class CasinoMazeScene extends Phaser.Scene {
      constructor() {
        super({ key: 'CasinoMazeScene' });
        this.isDragging = false;
        this.isGameFinished = false;
        this.targetPoint = new Phaser.Math.Vector2();
      }

      preload() {
        // Carga de la imagen de fondo que subirás a GitHub como 'fondo.png'
        this.load.image('fondo', 'fondo.png');
        this.load.image('regalo', 'regalo.png');
      }

      create() {
        // Frecuencia física a 120 FPS anti-tunneling
        this.physics.world.setFPS(120);
        this.physics.world.OVERLAP_BIAS = 16;

        const canvasW = this.cameras.main.width;
        const canvasH = this.cameras.main.height;

        // Si 'fondo.png' se carga exitosamente, se muestra de fondo en Phaser
        if (this.textures.exists('fondo') && this.textures.get('fondo').key !== '__MISSING') {
          const bg = this.add.image(canvasW / 2, canvasH / 2, 'fondo');
          bg.setDisplaySize(canvasW, canvasH);
          bg.setDepth(-10);
        }

        // Crear texturas en la gama Azul Rey y Oro
        this.createCasinoTextures();

        // Iniciar la partida con el laberinto encajado exactamente en el centro de 'fondo.png'
        this.startSingleGame();

        // Controles táctiles
        this.setupTouchControls();
      }

      /**
       * Texturas de paredes con Azul Rey Vibrante y Borde Oro Brillante
       */
      createCasinoTextures() {
        // 1. Pared Interna: Azul Rey translúcido con resplandor y bisel de Oro Brillante
        const wGfx = this.make.graphics({ x: 0, y: 0, add: false });
        wGfx.fillStyle(0x0f245c, 0.88); // Deja ver el satén azul del fondo
        wGfx.fillRoundedRect(1.5, 1.5, 31, 31, 5);
        wGfx.lineStyle(1.5, 0x1d4ed8, 0.85); // Resplandor azul
        wGfx.strokeRoundedRect(2.5, 2.5, 29, 29, 4);
        wGfx.lineStyle(2, 0xfacc15, 1); // Borde Oro Brillante
        wGfx.strokeRoundedRect(1, 1, 32, 32, 5);
        // Remache dorado decorativo en esquinas
        wGfx.fillStyle(0xfef08a, 0.95);
        wGfx.fillCircle(4, 4, 1.4);
        wGfx.generateTexture('wallTexture', 34, 34);
        wGfx.destroy();

        // 2. Pared Perimetral: Marco exterior de oro brillante con núcleo azul zafiro
        const bGfx = this.make.graphics({ x: 0, y: 0, add: false });
        bGfx.fillStyle(0x0a1840, 0.94);
        bGfx.fillRoundedRect(1, 1, 32, 32, 6);
        bGfx.lineStyle(2.5, 0xeab308, 1); // Oro intenso
        bGfx.strokeRoundedRect(1, 1, 32, 32, 6);
        bGfx.lineStyle(1.2, 0xfef08a, 0.9); // Reflejo dorado
        bGfx.strokeRoundedRect(3, 3, 28, 28, 4);
        bGfx.generateTexture('borderWallTexture', 34, 34);
        bGfx.destroy();

        // 3. Partículas de oro y victoria
        const spGfx = this.make.graphics({ x: 0, y: 0, add: false });
        spGfx.fillStyle(0xfde047, 1);
        spGfx.fillCircle(4, 4, 3.5);
        spGfx.generateTexture('goldParticle', 8, 8);
        spGfx.destroy();

        // 4. Halo dorado suave para el trébol 🍀
        const auraGfx = this.make.graphics({ x: 0, y: 0, add: false });
        auraGfx.fillStyle(0xfacc15, 0.32);
        auraGfx.fillCircle(18, 18, 17);
        auraGfx.fillStyle(0x16a34a, 0.22);
        auraGfx.fillCircle(18, 18, 11);
        auraGfx.generateTexture('cloverAura', 36, 36);
        auraGfx.destroy();
      }

      /**
       * Ubica y ajusta el laberinto a las medidas exactas del flyer 'fondo.png'
       */
      startSingleGame() {
        const canvasW = this.cameras.main.width;
        const canvasH = this.cameras.main.height;

        /* =====================================================================
           MEDIDAS EXACTAS DE 'fondo.png' (Proporción 3:4 / Flyer El Rey)
           - Zona Superior (0% - 25.4%): Logotipo "EL REY", león y retratos.
           - Zona Inferior (80.2% - 100%): Texto "arrastra el trébol hacia el regalo..."
           - Márgenes Laterales (0% - 16.4% y 83.6% - 100%): Cintas y monedas.
           - Área de Juego Libre: X de 16.4% a 83.6%, Y de 25.5% a 79.8%
           ===================================================================== */
        const minX = canvasW * 0.164;
        const maxX = canvasW * 0.836;
        const minY = canvasH * 0.256;
        const maxY = canvasH * 0.798;

        const availableW = maxX - minX;
        const availableH = maxY - minY;

        // 13 columnas x 15 filas: Más recovecos, bifurcaciones y mayor dificultad
        const cols = 13;
        const rows = 15;

        // Generación DFS infalible (garantiza camino pero con más bifurcaciones y caminos falsos)
        const mazeData = generateDFSMaze(cols, rows);
        this.mazeGrid = mazeData.maze;
        this.mazeWidth = mazeData.width;
        this.mazeHeight = mazeData.height;

        this.tileSize = Math.min(
          Math.floor(availableW / this.mazeWidth),
          Math.floor(availableH / this.mazeHeight),
          32
        );

        // Centrado exacto sobre el terciopelo azul del fondo
        const mazePixelW = this.mazeWidth * this.tileSize;
        const mazePixelH = this.mazeHeight * this.tileSize;
        this.offsetX = Math.floor(minX + (availableW - mazePixelW) / 2);
        this.offsetY = Math.floor(minY + (availableH - mazePixelH) / 2);

        // Limpiar elementos de partidas previas
        if (this.walls) this.walls.clear(true, true);
        if (this.player) this.player.destroy();
        if (this.playerAura) this.playerAura.destroy();
        if (this.goal) this.goal.destroy();
        if (this.pathDots) this.pathDots.clear(true, true);
        if (this.sparkleEmitter) this.sparkleEmitter.destroy();

        this.walls = this.physics.add.staticGroup();
        this.pathDots = this.add.group();

        // Dibujar las paredes del laberinto
        for (let r = 0; r < this.mazeHeight; r++) {
          for (let c = 0; c < this.mazeWidth; c++) {
            const posX = this.offsetX + c * this.tileSize + this.tileSize / 2;
            const posY = this.offsetY + r * this.tileSize + this.tileSize / 2;

            if (this.mazeGrid[r][c] === 1) {
              const isBorder = (r === 0 || r === this.mazeHeight - 1 || c === 0 || c === this.mazeWidth - 1);
              const texKey = isBorder ? 'borderWallTexture' : 'wallTexture';
              const wall = this.walls.create(posX, posY, texKey);
              wall.setDisplaySize(this.tileSize, this.tileSize);
              wall.refreshBody();
            } else {
              // Puntos dorados tenues en los caminos para guiar al jugador
              const dot = this.add.circle(posX, posY, 1.8, 0xfacc15, 0.5);
              this.pathDots.add(dot);
            }
          }
        }

        // =====================================================================
        // META: CAJA DE REGALOS 🎁 (Ubicada en la casilla inferior derecha,
        // exactamente sobre la frase "hacia el regalo" de 'fondo.png')
        // =====================================================================
        const goalX = this.offsetX + mazeData.goal.col * this.tileSize + this.tileSize / 2;
        const goalY = this.offsetY + mazeData.goal.row * this.tileSize + this.tileSize / 2;

        if (this.textures.exists('regalo') && this.textures.get('regalo').key !== '__MISSING') {
          this.goal = this.physics.add.sprite(goalX, goalY, 'regalo');
          this.goal.setDisplaySize(this.tileSize * 0.94, this.tileSize * 0.94);
          this.goal.body.setCircle(Math.round(this.tileSize * 0.35));
        } else {
          const emojiSize = Math.round(this.tileSize * 0.86);
          this.goal = this.add.text(goalX, goalY, '🎁', {
            fontSize: `${emojiSize}px`,
            fontFamily: '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif'
          }).setOrigin(0.5, 0.5);

          this.physics.world.enable(this.goal);
          const goalRadius = Math.round(this.tileSize * 0.35);
          this.goal.body.setCircle(
            goalRadius,
            (this.goal.width / 2) - goalRadius,
            (this.goal.height / 2) - goalRadius
          );
        }

        this.goal.body.setImmovable(true);

        // Animación de pulso continuo en el regalo
        this.tweens.add({
          targets: this.goal,
          scale: { from: 0.92, to: 1.15 },
          angle: { from: -6, to: 6 },
          duration: 900,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });

        // =====================================================================
        // PERSONAJE: TRÉBOL DE 4 HOJAS 🍀 (Ubicado en la salida superior)
        // =====================================================================
        const startX = this.offsetX + mazeData.start.col * this.tileSize + this.tileSize / 2;
        const startY = this.offsetY + mazeData.start.row * this.tileSize + this.tileSize / 2;

        this.playerAura = this.add.image(startX, startY, 'cloverAura');
        this.playerAura.setDisplaySize(this.tileSize * 1.15, this.tileSize * 1.15);

        const cloverFontSize = Math.round(this.tileSize * 0.82);
        this.player = this.add.text(startX, startY, '🍀', {
          fontSize: `${cloverFontSize}px`,
          fontFamily: '"Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif'
        }).setOrigin(0.5, 0.5);

        this.physics.world.enable(this.player);

        // Radio circular de colisión física
        const colRadius = Math.round(this.tileSize * 0.28);
        this.player.body.setCircle(
          colRadius,
          (this.player.width / 2) - colRadius,
          (this.player.height / 2) - colRadius
        );
        this.player.body.setCollideWorldBounds(true);
        this.player.body.setBounce(0, 0);
        this.player.body.setFriction(0, 0);
        this.player.body.setMaxSpeed(260);

        // Pulsación suave del trébol
        this.tweens.add({
          targets: [this.player, this.playerAura],
          scale: { from: 0.95, to: 1.08 },
          duration: 750,
          yoyo: true,
          repeat: -1,
          ease: 'Sine.easeInOut'
        });

        // Físicas: colisión sólida con paredes y meta
        this.physics.add.collider(this.player, this.walls);
        this.physics.add.overlap(this.player, this.goal, this.handleVictory, null, this);

        // Destellos dorados para la victoria
        this.sparkleEmitter = this.add.particles(0, 0, 'goldParticle', {
          speed: { min: 80, max: 220 },
          scale: { start: 1.5, end: 0 },
          blendMode: 'ADD',
          lifespan: 800,
          gravityY: 150,
          emitting: false
        });

        this.isDragging = false;
        this.isGameFinished = false;
        this.targetPoint.set(this.player.x, this.player.y);
      }

      // =====================================================================
      // GESTIÓN DEL CONTROL TÁCTIL POR ARRASTRE
      // =====================================================================
      setupTouchControls() {
        this.input.on('pointerdown', (pointer) => {
          if (this.isGameFinished) return;

          const dist = Phaser.Math.Distance.Between(pointer.x, pointer.y, this.player.x, this.player.y);
          const grabTolerance = 42;

          if (dist <= grabTolerance) {
            this.isDragging = true;
            this.targetPoint.set(pointer.x, pointer.y);
            sound.playGrab();

            this.tweens.add({
              targets: [this.player, this.playerAura],
              scale: 1.2,
              duration: 120,
              ease: 'Back.easeOut'
            });
          }
        });

        this.input.on('pointermove', (pointer) => {
          if (this.isDragging && !this.isGameFinished) {
            this.targetPoint.set(pointer.x, pointer.y);
          }
        });

        const stopDrag = () => {
          if (this.isDragging) {
            this.isDragging = false;
            this.player.body.setVelocity(0, 0);

            this.tweens.add({
              targets: [this.player, this.playerAura],
              scale: 1.0,
              duration: 120,
              ease: 'Sine.easeOut'
            });
          }
        };

        this.input.on('pointerup', stopDrag);
        this.input.on('pointerupoutside', stopDrag);
      }

      // =====================================================================
      // ACTUALIZACIÓN DE FÍSICAS (EL TRÉBOL NUNCA TRASPASA LAS PAREDES)
      // =====================================================================
      update() {
        if (this.isGameFinished) return;

        if (this.isDragging && this.player && this.player.body) {
          const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, this.targetPoint.x, this.targetPoint.y);

          if (dist > 4) {
            const angle = Phaser.Math.Angle.Between(this.player.x, this.player.y, this.targetPoint.x, this.targetPoint.y);
            const speed = Math.min(dist * 10, 260);

            this.player.body.setVelocity(
              Math.cos(angle) * speed,
              Math.sin(angle) * speed
            );
          } else {
            this.player.body.setVelocity(0, 0);
          }
        } else if (this.player && this.player.body) {
          this.player.body.setVelocity(0, 0);
        }

        if (this.playerAura && this.player) {
          this.playerAura.x = this.player.x;
          this.playerAura.y = this.player.y;
        }
      }

      // =====================================================================
      // GESTIÓN DE VICTORIA Y WHATSAPP
      // =====================================================================
      handleVictory() {
        if (this.isGameFinished) return;
        this.isGameFinished = true;
        this.isDragging = false;

        this.player.body.setVelocity(0, 0);
        sound.playVictory();

        // Efecto visual de monedas y estrellas
        this.sparkleEmitter.explode(45, this.goal.x, this.goal.y);

        this.tweens.add({
          targets: [this.player, this.playerAura],
          x: this.goal.x,
          y: this.goal.y,
          scale: 1.45,
          duration: 320,
          ease: 'Back.easeOut'
        });

        // Configurar enlace de WhatsApp
        const claimBtn = document.getElementById('btn-claim-prize');
        claimBtn.href = buildWhatsAppUrl();

        // Desplegar pop-up de "¡Felicitaciones!"
        setTimeout(() => {
          document.getElementById('victory-modal').classList.add('active');
        }, 340);
      }

      resetGame() {
        document.getElementById('victory-modal').classList.remove('active');
        this.startSingleGame();
        showToast('¡Nuevo laberinto de la fortuna generado!');
      }
    }

    /* ==========================================================================
       CONFIGURACIÓN DE PHASER 3 CON PROPORCIÓN 3:4 IDÉNTICA A 'fondo.png'
       ========================================================================== */
    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: 390,
      height: 520, // Proporción 3:4 idéntica a 'fondo.png' (390 x 520)
      transparent: true, // Totalmente transparente para integrar 'fondo.png'
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 390,
        height: 520
      },
      physics: {
        default: 'arcade',
        arcade: {
          gravity: { y: 0 },
          debug: false,
          fps: 120
        }
      },
      scene: [CasinoMazeScene]
    };

    // Iniciar juego
    const game = new Phaser.Game(config);

    // Controles de interfaz
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    document.getElementById('btn-restart').addEventListener('click', () => {
      const scene = game.scene.getScene('CasinoMazeScene');
      if (scene) scene.resetGame();
    });

    document.getElementById('btn-sound').addEventListener('click', (e) => {
      sound.enabled = !sound.enabled;
      e.currentTarget.textContent = sound.enabled ? '🔊' : '🔇';
      showToast(sound.enabled ? 'Sonido activado' : 'Sonido silenciado');
    });

    document.getElementById('btn-modal-retry').addEventListener('click', () => {
      const scene = game.scene.getScene('CasinoMazeScene');
      if (scene) scene.resetGame();
    });
  </script>
</body>
</html>
